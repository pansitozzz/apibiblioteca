<mat-toolbar color="primary">
  <span routerLink="/catalogo" class="brand">Biblioteca UNTELS</span>
  <span class="spacer"></span>

  @if (authService.estaAutenticado()) {
    <button mat-button routerLink="/catalogo">Catálogo</button>
    <button mat-button routerLink="/mis-prestamos">Mis préstamos</button>

    @if (esBibliotecarioOAdmin()) {
      <button mat-button [matMenuTriggerFor]="menuGestion">Gestión</button>
      <mat-menu #menuGestion="matMenu">
        <button mat-menu-item routerLink="/admin/libros">Libros</button>
        <button mat-menu-item routerLink="/admin/autores">Autores</button>
        <button mat-menu-item routerLink="/admin/categorias">Categorías</button>
        <button mat-menu-item routerLink="/admin/prestamos">Préstamos y devoluciones</button>
      </mat-menu>
    }

    <button mat-icon-button [matMenuTriggerFor]="menuUsuario">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #menuUsuario="matMenu">
      <div class="usuario-info" mat-menu-item disabled>
        {{ authService.usuario()?.nombre }} {{ authService.usuario()?.apellido }} ({{ authService.rol() }})
      </div>
      <button mat-menu-item (click)="cerrarSesion()">
        <mat-icon>logout</mat-icon>
        Cerrar sesión
      </button>
    </mat-menu>
  } @else {
    <button mat-button routerLink="/login">Iniciar sesión</button>
    <button mat-raised-button color="accent" routerLink="/register">Registrarse</button>
  }
</mat-toolbar>
