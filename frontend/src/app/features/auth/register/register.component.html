<div class="form-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Crear cuenta de estudiante</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="formulario" (ngSubmit)="enviar()">
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="nombre">
        </mat-form-field>

        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Apellido</mat-label>
          <input matInput formControlName="apellido">
        </mat-form-field>

        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username">
        </mat-form-field>

        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Contrasena</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password">
          @if (formulario.get('password')?.hasError('minlength')) {
            <mat-error>Debe tener al menos 8 caracteres</mat-error>
          }
        </mat-form-field>

        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Codigo de estudiante (opcional)</mat-label>
          <input matInput formControlName="codigoEstudiante">
        </mat-form-field>

        @if (error()) {
          <p class="mensaje-error">{{ error() }}</p>
        }

        <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="cargando()">
          Crear cuenta
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer class="footer">
      <p>Ya tienes cuenta? <a routerLink="/login">Inicia sesion</a></p>
    </mat-card-footer>
  </mat-card>
</div>
