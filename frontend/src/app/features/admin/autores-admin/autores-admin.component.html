<div class="page-container">
  <div class="encabezado">
    <h1>Gestion de autores</h1>
    <button mat-raised-button color="primary" (click)="nuevo()">
      <mat-icon>add</mat-icon>
      Nuevo autor
    </button>
  </div>

  @if (mostrarFormulario()) {
    <form [formGroup]="formulario" (ngSubmit)="guardar()" class="formulario">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Apellido</mat-label>
        <input matInput formControlName="apellido">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Nacionalidad</mat-label>
        <input matInput formControlName="nacionalidad">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Biografia</mat-label>
        <textarea matInput formControlName="biografia" rows="3"></textarea>
      </mat-form-field>

      <div class="acciones-formulario">
        <button mat-button type="button" (click)="cancelar()">Cancelar</button>
        <button mat-raised-button color="primary" type="submit">Guardar</button>
      </div>
    </form>
  }

  <table mat-table [dataSource]="autores()" class="full-width">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let a">{{ a.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="apellido">
      <th mat-header-cell *matHeaderCellDef>Apellido</th>
      <td mat-cell *matCellDef="let a">{{ a.apellido }}</td>
    </ng-container>

    <ng-container matColumnDef="nacionalidad">
      <th mat-header-cell *matHeaderCellDef>Nacionalidad</th>
      <td mat-cell *matCellDef="let a">{{ a.nacionalidad }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let a">
        <button mat-icon-button (click)="editar(a)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button (click)="eliminar(a)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
  </table>
</div>
