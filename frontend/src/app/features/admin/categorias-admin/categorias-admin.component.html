<div class="page-container">
  <div class="encabezado">
    <h1>Gestion de categorias</h1>
    <button mat-raised-button color="primary" (click)="nueva()">
      <mat-icon>add</mat-icon>
      Nueva categoria
    </button>
  </div>

  @if (mostrarFormulario()) {
    <form [formGroup]="formulario" (ngSubmit)="guardar()" class="formulario">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descripcion</mat-label>
        <input matInput formControlName="descripcion">
      </mat-form-field>

      <div class="acciones-formulario">
        <button mat-button type="button" (click)="cancelar()">Cancelar</button>
        <button mat-raised-button color="primary" type="submit">Guardar</button>
      </div>
    </form>
  }

  <table mat-table [dataSource]="categorias()" class="full-width">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let c">{{ c.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripcion</th>
      <td mat-cell *matCellDef="let c">{{ c.descripcion }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let c">
        <button mat-icon-button (click)="editar(c)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button (click)="eliminar(c)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
  </table>
</div>
