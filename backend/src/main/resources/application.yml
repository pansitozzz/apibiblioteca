spring:
  application:
    name: biblioteca-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  prestamo:
    dias-plazo: ${PRESTAMO_DIAS_PLAZO:14}
  multa:
    monto-por-dia: ${MULTA_MONTO_POR_DIA:2.00}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biblioteca_db}
    username: ${DB_USERNAME:biblioteca_user}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true

logging:
  level:
    pe.edu.untels.biblioteca: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME:biblioteca_db}
    username: ${DB_USERNAME:biblioteca_user}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
