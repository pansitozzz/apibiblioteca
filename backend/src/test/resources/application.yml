spring:
  datasource:
    url: jdbc:h2:mem:biblioteca_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-unit-and-integration-tests-only-not-for-production
    expiration-ms: 3600000
  prestamo:
    dias-plazo: 14
  multa:
    monto-por-dia: 2.00
